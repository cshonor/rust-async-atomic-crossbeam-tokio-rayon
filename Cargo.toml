[workspace]
members = [".", "atomic", "crossbeam", "rayon"]
resolver = "2"

[package]
name = "rust-async-atomic-crossbeam-tokio-rayon"
version = "0.1.0"
edition = "2021"
description = "Rust 并发 / 异步 / 原子操作学习与实践"
repository = "https://github.com/cshonor/rust-async-atomic-crossbeam-tokio-rayon"

[dependencies]
study_atomic = { path = "atomic" }
study_crossbeam = { path = "crossbeam" }
study_rayon = { path = "rayon" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
futures-lite = "2"
flume = "0.11"
mio = { version = "1", default-features = false, features = ["net", "os-poll"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
async-trait = "0.1"
mockall = "0.13"

[[example]]
name = "ch01_reqwest_join"
path = "async_tokio/ch01_async_intro/ch01_reqwest_join.rs"

